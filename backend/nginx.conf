# Configuração de Proxy Reverso Nginx para a API FastAPI VoiceSplitting

server {
    listen 80;
    server_name seu-dominio-ou-ip.com;

    # Redirecionar HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seu-dominio-ou-ip.com;

    # Certificados SSL (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/seu-dominio-ou-ip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio-ou-ip.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Permitir uploads de arquivos de áudio até 100MB
    client_max_body_size 100M;

    # Timeouts estendidos para permitir o tempo de processamento de AI da separação de áudio
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Servir Frontend Estático / PWA (dist)
    location / {
        root /var/www/voicesplitting/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso para a API FastAPI (Uvicorn rodando na porta 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desativar buffer para respostas de áudio em streaming
        proxy_buffering off;
    }
}
